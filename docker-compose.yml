services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: celeste
      POSTGRES_PASSWORD: celeste
      POSTGRES_DB: celeste
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeste -d celeste"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - celeste-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

volumes:
  celeste-postgres:
