name: Celeste CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check:frontend

      - name: Lint
        run: pnpm lint:frontend

      - name: Tests
        run: pnpm test:frontend

      - name: Build
        run: pnpm build:frontend

  backend:
    name: Backend quality and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: celeste
          POSTGRES_PASSWORD: celeste
          POSTGRES_DB: celeste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U celeste -d celeste_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://celeste:celeste@localhost:5432/celeste_test?schema=public
      TEST_DATABASE_URL: postgresql://celeste:celeste@localhost:5432/celeste_test?schema=public
      NODE_ENV: test
      FRONTEND_ORIGIN: http://localhost:5173
      BUSINESS_TIMEZONE: America/Sao_Paulo
      TERMS_VERSION: 2026-09-draft
      PRIVACY_VERSION: 2026-09-draft

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Seed database twice and validate idempotency
        run: |
          pnpm db:seed
          pnpm db:seed
          pnpm db:seed:validate

      - name: TypeScript
        run: pnpm check:server

      - name: Lint
        run: pnpm lint:server

      - name: Unit tests
        run: pnpm test:server:unit

      - name: Integration tests
        run: pnpm test:server:integration

      - name: Coverage
        run: pnpm coverage:server

      - name: Build
        run: pnpm build:server
